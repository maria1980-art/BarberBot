services:
  postgres_db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      TZ: ${BUSINESS_TIMEZONE:-Europe/Madrid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/001-init_db.sql:ro
      - ./migrations/001_recordatorios.sql:/docker-entrypoint-initdb.d/002-recordatorios.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - barberbot_internal

  web_api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      BARBERBOT_LOCAL_ID: ${BARBERBOT_LOCAL_ID:?Set BARBERBOT_LOCAL_ID in .env}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Europe/Madrid}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:?Set WHATSAPP_VERIFY_TOKEN in .env}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:?Set WHATSAPP_APP_SECRET in .env}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:?Set WHATSAPP_API_TOKEN in .env}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:?Set WHATSAPP_PHONE_NUMBER_ID in .env}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:?Set WHATSAPP_GRAPH_API_VERSION in .env}
    ports:
      - "8000:8000"
    depends_on:
      postgres_db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - barberbot_internal

  cron_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python worker.py
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Europe/Madrid}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:?Set WHATSAPP_API_TOKEN in .env}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:?Set WHATSAPP_PHONE_NUMBER_ID in .env}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:?Set WHATSAPP_GRAPH_API_VERSION in .env}
      WHATSAPP_REMINDER_TEMPLATE_NAME: ${WHATSAPP_REMINDER_TEMPLATE_NAME:?Set WHATSAPP_REMINDER_TEMPLATE_NAME in .env}
      WHATSAPP_REMINDER_TEMPLATE_LANGUAGE: ${WHATSAPP_REMINDER_TEMPLATE_LANGUAGE:-es}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - barberbot_internal

volumes:
  postgres_data:

networks:
  barberbot_internal:
    driver: bridge
